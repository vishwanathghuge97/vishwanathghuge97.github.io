<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#F6FAF9" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#101615" media="(prefers-color-scheme: dark)">
  <meta name="color-scheme" content="light dark">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <meta name="description" content="Apps by Vishwanath — page not found.">
  <title>Page not found — Apps by Vishwanath</title>
  <style>
    :root {
      color-scheme: light;
      --background: #F6FAF9;
      --surface: #FFFFFF;
      --text: #14201F;
      --muted: #475958;
      --outline: #6E8280;
      --primary: #00796B;
      --on-primary: #FFFFFF;
      --primary-hover: #00695C;
      --brand: #00B3A1;
      --focus: #00796B;
    }

    @media (prefers-color-scheme: dark) {
      :root {
        color-scheme: dark;
        --background: #101615;
        --surface: #1A2321;
        --text: #EAF2F0;
        --muted: #B6C6C3;
        --outline: #849892;
        --primary: #00B3A1;
        --on-primary: #04241F;
        --primary-hover: #3FD3C5;
        --brand: #00B3A1;
        --focus: #00B3A1;
      }
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html {
      background: var(--background);
      -webkit-text-size-adjust: 100%;
      text-size-adjust: 100%;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: var(--background);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      font-size: 1.125rem;
      line-height: 1.5;
    }

    .page {
      width: min(100%, 640px);
      margin: 0 auto;
      padding: 24px 20px 40px;
      display: flex;
      flex-direction: column;
      min-height: 100vh;
    }

    .site-header {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 56px;
    }

    .site-mark {
      flex: none;
      width: 40px;
      height: 40px;
    }

    .site-wordmark {
      font-size: 1.375rem;
      font-weight: 650;
      line-height: 1.25;
    }

    main {
      padding-top: 56px;
    }

    .code {
      margin: 0;
      font-size: 4rem;
      font-weight: 650;
      line-height: 1;
      color: var(--muted);
      letter-spacing: 0.04em;
    }

    h1 {
      margin: 8px 0 0;
      font-size: 2rem;
      font-weight: 650;
      line-height: 1.2;
    }

    .lede {
      margin: 12px 0 0;
      max-width: 44ch;
      color: var(--muted);
      font-size: 1.125rem;
    }

    .button {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      min-height: 56px;
      margin-top: 28px;
      padding: 12px 22px;
      border-radius: 16px;
      background: var(--primary);
      color: var(--on-primary);
      font-size: 1.0625rem;
      font-weight: 650;
      text-decoration: none;
      transition: background-color 120ms linear;
    }

    @media (hover: hover) and (pointer: fine) {
      .button:hover {
        background: var(--primary-hover);
      }
    }

    .secondary {
      margin: 20px 0 0;
      color: var(--muted);
      font-size: 1rem;
    }

    .secondary a {
      color: var(--primary);
      font-weight: 650;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    a:focus-visible {
      outline: 3px solid var(--focus);
      outline-offset: 2px;
      border-radius: 4px;
    }

    .site-footer {
      margin-top: auto;
      padding-top: 40px;
      border-top: 1px solid var(--outline);
      color: var(--muted);
      font-size: 0.9375rem;
    }

    .site-footer a {
      color: inherit;
      text-decoration: underline;
      text-underline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce) {
      .button {
        transition: none;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <header class="site-header">
      <svg class="site-mark" viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#00B3A1"></rect>
        <g stroke="#04241F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none">
          <path d="M7.5 12.5h10"></path>
          <path d="M14.5 8.5l4.5 4-4.5 4"></path>
          <path d="M24.5 19.5h-10"></path>
          <path d="M17.5 15.5l-4.5 4 4.5 4"></path>
        </g>
      </svg>
      <span class="site-wordmark">Apps by Vishwanath</span>
    </header>

    <main>
      <p class="code" aria-hidden="true">404</p>
      <h1>Page not found</h1>
      <p class="lede">
        That URL does not point at a page that exists. It may have moved, or the
        link may be wrong.
      </p>
      <a class="button" href="/">Back to Apps by Vishwanath</a>
      <p class="secondary">
        Looking for Kable? <a href="/kable-download/">Go to the Kable download page</a>.
      </p>
    </main>

    <footer class="site-footer">
      <a href="https://github.com/vishwanathghuge97" rel="noopener">GitHub</a>
    </footer>
  </div>
</body>
</html>
